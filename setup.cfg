[metadata]
name = plover_dictionary_builder
version = 1.0.0
description = Build up a steno dictionary from text content
long_description = file: README.rst
long_description_content_type = text/x-rst
author = Ted Morin
author_email = morinted@gmail.com
license = GPL-2.0-or-later
url = https://github.com/opensteno/plover_dictionary_builder
classifiers =
	Development Status :: 4 - Beta
	Environment :: Plugins
	Intended Audience :: End Users/Desktop
	Operating System :: OS Independent
	Programming Language :: Python :: 3
keywords = plover plover_plugin

[options]
zip_safe = True
install_requires =
	plover>=5.0.0
packages =
	plover_dictionary_builder

[options.entry_points]
plover.gui.qt.tool =
	dictionary_builder = plover_dictionary_builder.dictionary_builder:DictionaryBuilder

# vim: commentstring=#\ %s list
